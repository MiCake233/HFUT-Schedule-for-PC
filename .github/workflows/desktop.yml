# 无界面检查：桌面单元测试与 detekt。
# snapshot、verify* 会拉起窗口或依赖本机数据；packageMsi / packageDmg 是打包任务，不在这里跑。
name: desktop

on:
  pull_request:
  push:
    branches:
      - desktop-windows

permissions:
  contents: read

jobs:
  check:
    name: unit tests and detekt
    runs-on: ubuntu-latest
    env:
      # 托管运行器没有显示器。该参数会传给 Gradle 与测试进程，避免 AWT 去连接 X11。
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # :desktopApp 依赖 :app 的 JVM 目标，但整个工程在配置阶段会加载 Android Gradle Plugin，
      # 因此需要 Android SDK。只安装编译用的平台，不启动模拟器。
      - uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      # 仓库里的 gradlew 没有可执行位，直接 ./gradlew 会在托管运行器上被拒绝。
      - name: Desktop unit tests and detekt
        run: bash ./gradlew :desktopApp:test :desktopApp:detekt
